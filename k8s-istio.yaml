apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-logging-app
  namespace: logging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloud-logging-app
  template:
    metadata:
      labels:
        app: cloud-logging-app
    spec:
      containers:
        - name: cloud-logging-app
          image: cloud-native-logging:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: cloud-logging-service
  namespace: logging
spec:
  selector:
    app: cloud-logging-app
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP